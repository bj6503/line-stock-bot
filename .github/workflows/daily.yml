name: Daily Stock Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - morning_force
          - combo
          - combo_force
          - watchlist_test
          - env_test
          - finmind_test
          - risk_test
          - picks_test
          - bb_test

jobs:
  morning-scan:
    runs-on: ubuntu-latest
    if: inputs.mode == 'morning' || inputs.mode == 'morning_force'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 早盤掃描
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_RUN: ${{ inputs.mode == 'morning_force' }}
        run: python bot.py
      - name: 儲存追蹤清單
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add daily_state.json || true
          git diff --staged --quiet || git commit -m "state: morning picks"
          git push || echo "no push needed"

  combo-scan:
    runs-on: ubuntu-latest
    if: inputs.mode == 'combo' || inputs.mode == 'combo_force'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 收盤檢討
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FORCE_RUN: ${{ inputs.mode == 'combo_force' }}
        run: python combo.py

  watchlist-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'watchlist_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests
      - name: 觀察名單測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python watchlist.py

  env-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'env_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests yfinance pandas
      - name: 環境判讀測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python market_env.py

  finmind-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'finmind_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests
      - name: FinMind測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python finmind_test.py

  risk-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'risk_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests
      - name: 風險地圖測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python risk_map.py

  picks-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'picks_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests
      - name: 動態名單測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python daily_picks.py

  bb-test:
    runs-on: ubuntu-latest
    if: inputs.mode == 'bb_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install requests
      - name: 布林縮口測試
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python bb_squeeze.py
